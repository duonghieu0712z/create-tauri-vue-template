name: Publish

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install template dependencies
        working-directory: template
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Pack dry run
        run: pnpm pack --dry-run

      - name: Publish
        run: pnpm publish --access public --no-git-checks

  release:
    name: Create GitHub release
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read package version
        id: version
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));

          if (typeof version !== 'string' || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Invalid package version: ${version}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE

      - name: Read release changelog
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ruby <<'RUBY'
          require 'json'
          require 'securerandom'

          ref = ENV.fetch('RELEASE_TAG')
          version = ENV.fetch('RELEASE_VERSION')
          body = "Version #{version} release."

          if File.exist?('CHANGELOG.md')
            begin
              content = File.read('CHANGELOG.md')
              escaped_version = Regexp.escape(version)
              pattern = /^##\s+(?<heading>\[?v?#{escaped_version}\]?(?:\s+-[^\r\n]*)?)\r?\n(?<body>.*?)(?=^##\s+|\z)/m
              match = content.match(pattern)

              if match && !match[:body].strip.empty?
                anchor = match[:heading]
                  .strip
                  .downcase
                  .gsub(/[\[\].]/, '')
                  .gsub(/[^a-z0-9 _-]/, '')
                  .gsub(/\s+/, '-')
                changelog_url = "#{ENV.fetch('GITHUB_SERVER_URL')}/#{ENV.fetch('GITHUB_REPOSITORY')}/blob/#{ref}/CHANGELOG.md##{anchor}"
                body = "#{match[:body].strip}\n\n[See full changelog](#{changelog_url})"
              end
            rescue StandardError
              warn 'Failed to read release changelog. Using fallback release body.'
            end
          end

          delimiter = SecureRandom.uuid
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |output|
            output.puts "body<<#{delimiter}"
            output.puts body
            output.puts delimiter
          end
          RUBY

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          target_commitish: ${{ github.sha }}
